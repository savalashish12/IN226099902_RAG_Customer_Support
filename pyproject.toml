[project]
name = "technova-rag-support"
version = "1.0.0"
description = "RAG-based enterprise customer support assistant with HITL"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["venv", ".venv", "__pycache__", "submission"]

[tool.ruff.lint]
# Sensible defaults; keep the build green while the codebase evolves
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402", "F401", "F841"]

[tool.pytest.ini_options]
testpaths = ["test"]
